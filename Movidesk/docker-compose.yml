# Deploy do painel numa VM já existente (Postgres e a apidatalake são
# serviços externos — não sobem aqui). Ver DEPLOY.md para o passo a passo
# completo na VM OCI.
services:
  painel:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      # Pasta Jira/ (sibling de Movidesk/) fica FORA da imagem — é onde o
      # jira_extractor.py (cron externo) grava os .json que a aba Jira lê via
      # JIRA_DATA_DIR (default resolve pra /Jira dentro do container, ver
      # server/routes/jira.js). Sem esse volume o container não a enxerga.
      - ../Jira:/Jira:ro
    restart: unless-stopped
